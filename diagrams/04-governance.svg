<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040" role="img" aria-labelledby="title description">
<title id="title">Governance architecture</title><desc id="description">Central model control with project-scoped development and explicit runtime authorization.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#0078D4"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#107C10"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#D13438"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#647078"/></marker>
</defs>
<rect x="40" y="160" width="1440" height="245" fill="none" stroke="#107C10" stroke-width="2" stroke-dasharray="8 6"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start"><tspan x="64" y="202">Platform team / shared model services</tspan></text>
<rect x="80" y="240" width="530" height="115" fill="#EAF5E8" stroke="#107C10" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle"><tspan x="345" y="291.5">AI gateway</tspan><tspan x="345" y="321.5">Authorize caller + model / enforce limits</tspan></text>
<rect x="985" y="240" width="455" height="115" fill="#EAF5E8" stroke="#107C10" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="middle"><tspan x="1212.5" y="291.5">Central model resources</tspan><tspan x="1212.5" y="321.5">Approved deployments and versions</tspan></text>
<polyline points="620,300 975,300" fill="none" stroke="#107C10" stroke-width="2"  marker-end="url(#arrow-green)"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="middle"><tspan x="795" y="270">Gateway identity</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="790" y="351">No direct team access</tspan></text>
<rect x="40" y="550" width="680" height="305" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 6"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start"><tspan x="64" y="592">Application team / use case A</tspan></text>
<rect x="65" y="615" width="630" height="95" fill="#EAF4FD" stroke="#0078D4" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="middle"><tspan x="380" y="656.75">Separate dev / test / prod projects</tspan><tspan x="380" y="685.5">Prompt or hosted agents / scoped identities</tspan></text>
<rect x="65" y="765" width="630" height="65" fill="#F3F5F6" stroke="#647078" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="380" y="805.375">Authorized data and tools / environment-specific access</tspan></text>
<polyline points="365,720 365,755" fill="none" stroke="#0078D4" stroke-width="2"  marker-end="url(#arrow-blue)"/>
<rect x="800" y="550" width="680" height="305" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 6"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start"><tspan x="824" y="592">Application team / use case B</tspan></text>
<rect x="825" y="615" width="630" height="95" fill="#EAF4FD" stroke="#0078D4" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="middle"><tspan x="1140" y="656.75">Separate dev / test / prod projects</tspan><tspan x="1140" y="685.5">Prompt or hosted agents / scoped identities</tspan></text>
<rect x="825" y="765" width="630" height="65" fill="#F3F5F6" stroke="#647078" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="1140" y="805.375">Authorized data and tools / environment-specific access</tspan></text>
<polyline points="1125,720 1125,755" fill="none" stroke="#0078D4" stroke-width="2"  marker-end="url(#arrow-blue)"/>
<polyline points="660,605 660,455 240,455 240,365" fill="none" stroke="#107C10" stroke-width="2"  marker-end="url(#arrow-green)"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="start"><tspan x="45" y="501">Project or agent identity</tspan></text>
<polyline points="1420,605 1420,430 500,430 500,365" fill="none" stroke="#107C10" stroke-width="2"  marker-end="url(#arrow-green)"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="1030" y="501">Project or agent identity</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="23" text-anchor="start"><tspan x="40" y="918">Separate Foundry resources when network, administration or connection-sharing requirements differ.</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="967">Connections define routes. Identities and permissions authorize calls. Project boundaries do not create network isolation.</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="36" text-anchor="start"><tspan x="40" y="66">Governance architecture</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="110">Central model control with project-scoped development and explicit runtime authorization.</tspan></text>
</svg>