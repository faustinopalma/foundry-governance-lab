<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="760" viewBox="0 0 1520 760" role="img" aria-labelledby="title description">
<title id="title">Lab lifecycle and acceptance gates</title><desc id="description">Deployment, repeat testing and removal are separate operations.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#0078D4"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#107C10"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#D13438"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#647078"/></marker>
</defs>
<rect x="40" y="160" width="420" height="145" fill="#EAF4FD" stroke="#0078D4" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle"><tspan x="250" y="206.25">Prepare</tspan><tspan x="250" y="243.75">Review access and quota</tspan><tspan x="250" y="281.25">Initialize private state</tspan></text>
<rect x="550" y="160" width="420" height="145" fill="#EAF4FD" stroke="#0078D4" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle"><tspan x="760" y="206.25">Create A-dev</tspan><tspan x="760" y="243.75">Bootstrap and lock</tspan><tspan x="760" y="281.25">Activate and verify</tspan></text>
<rect x="1060" y="160" width="420" height="145" fill="#EAF4FD" stroke="#0078D4" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle"><tspan x="1270" y="206.25">Expand</tspan><tspan x="1270" y="243.75">Add case projects</tspan><tspan x="1270" y="281.25">Configure access</tspan></text>
<polyline points="470,235 540,235" fill="none" stroke="#0078D4" stroke-width="2"  marker-end="url(#arrow-blue)"/>
<polyline points="980,235 1050,235" fill="none" stroke="#0078D4" stroke-width="2"  marker-end="url(#arrow-blue)"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="29" text-anchor="start"><tspan x="40" y="374">Review each preview. Await completion and verify postconditions before the next stage.</tspan></text>
<polyline points="1270,315 1270,335 1500,335 1500,420 1270,420 1270,435" fill="none" stroke="#0078D4" stroke-width="2"  marker-end="url(#arrow-blue)"/>
<rect x="1060" y="445" width="420" height="150" fill="#EAF5E8" stroke="#107C10" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle"><tspan x="1270" y="493.75">Verify</tspan><tspan x="1270" y="531.25">Q01-Q11 all pass</tspan><tspan x="1270" y="568.75">Check expected denials</tspan></text>
<rect x="550" y="445" width="420" height="150" fill="#EAF5E8" stroke="#107C10" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle"><tspan x="760" y="493.75">Retain and observe</tspan><tspan x="760" y="531.25">Preserve the agent</tspan><tspan x="760" y="568.75">Keep the lab running</tspan></text>
<rect x="40" y="445" width="420" height="150" fill="#FDEEEF" stroke="#D13438" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="30" text-anchor="middle"><tspan x="250" y="493.75">Teardown</tspan><tspan x="250" y="531.25">Separate approval</tspan><tspan x="250" y="568.75">Guarded deletion</tspan></text>
<polyline points="1050,510 980,510" fill="none" stroke="#107C10" stroke-width="2"  marker-end="url(#arrow-green)"/>
<polyline points="540,510 470,510" fill="none" stroke="#D13438" stroke-width="2" stroke-dasharray="8 6" marker-end="url(#arrow-red)"/>
<polyline points="760,605 760,640 1270,640 1270,605" fill="none" stroke="#107C10" stroke-width="2"  marker-end="url(#arrow-green)"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="29" text-anchor="middle"><tspan x="1105" y="689">Repeat quick tests on the existing agent</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="36" text-anchor="start"><tspan x="40" y="66">Lab lifecycle and acceptance gates</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="110">Deployment, repeat testing and removal are separate operations.</tspan></text>
</svg>