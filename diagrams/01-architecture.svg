<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="1040" viewBox="0 0 1520 1040" role="img" aria-labelledby="title description">
<title id="title">01 / Lab architecture</title><desc id="description">Resource ownership and the configured service relationships in the delivered profile.</desc>
<rect width="100%" height="100%" fill="#ffffff"/>
<defs>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#0078D4"/></marker>
<marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#107C10"/></marker>
<marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#D13438"/></marker>
<marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="#647078"/></marker>
</defs>
<rect x="40" y="165" width="960" height="290" fill="none" stroke="#647078" stroke-width="2" stroke-dasharray="8 6"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start"><tspan x="64" y="207">Integration resource group</tspan></text>
<rect x="70" y="245" width="300" height="110" fill="#EAF4FD" stroke="#0078D4" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle"><tspan x="220" y="280.75">Private test runner</tspan><tspan x="220" y="308.25">Synthetic managed</tspan><tspan x="220" y="335.75">identities</tspan></text>
<rect x="650" y="245" width="320" height="110" fill="#EAF5E8" stroke="#107C10" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle"><tspan x="810" y="280.75">Private APIM gateway</tspan><tspan x="810" y="308.25">Caller policy + backend</tspan><tspan x="810" y="335.75">identity</tspan></text>
<polyline points="380,300 640,300" fill="none" stroke="#107C10" stroke-width="2"  marker-end="url(#arrow-green)"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="512.5" y="279">Approved client</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start"><tspan x="70" y="412">Lab VNet / Private DNS / Azure Monitor Private Link</tspan></text>
<rect x="1040" y="165" width="440" height="290" fill="none" stroke="#647078" stroke-width="2" stroke-dasharray="8 6"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start"><tspan x="1064" y="207">Models resource group</tspan></text>
<rect x="1080" y="245" width="360" height="110" fill="#EAF5E8" stroke="#107C10" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle"><tspan x="1260" y="294.5">Central Foundry resource</tspan><tspan x="1260" y="322">lab-chat model deployment</tspan></text>
<polyline points="980,300 1070,300" fill="none" stroke="#107C10" stroke-width="2"  marker-end="url(#arrow-green)"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="middle"><tspan x="1260" y="412">No agent projects</tspan></text>
<rect x="40" y="510" width="700" height="335" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 6"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start"><tspan x="64" y="552">Case A / Foundry account A</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="start"><tspan x="65" y="576">Agent subnet A is shared by A-dev and A-test.</tspan></text>
<rect x="65" y="605" width="310" height="165" fill="#EAF5E8" stroke="#107C10" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="220" y="656">A-dev</tspan><tspan x="220" y="682.25">Agent + APIM connection</tspan><tspan x="220" y="708.5">Own Storage / Search /</tspan><tspan x="220" y="734.75">Cosmos DB</tspan></text>
<rect x="405" y="605" width="310" height="165" fill="#EAF4FD" stroke="#0078D4" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="560" y="642.875">A-test</tspan><tspan x="560" y="669.125">Sibling-access + role</tspan><tspan x="560" y="695.375">checks</tspan><tspan x="560" y="721.625">Own Storage / Search /</tspan><tspan x="560" y="747.875">Cosmos DB</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="start"><tspan x="65" y="814">A-dev connects to APIM using its project identity.</tspan></text>
<rect x="780" y="510" width="700" height="335" fill="none" stroke="#0078D4" stroke-width="2" stroke-dasharray="8 6"/>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="24" text-anchor="start"><tspan x="804" y="552">Case B / Foundry account B</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="start"><tspan x="805" y="576">Agent subnet B is shared by B-dev and B-test.</tspan></text>
<rect x="805" y="605" width="310" height="165" fill="#F3F5F6" stroke="#647078" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="960" y="656">B-dev</tspan><tspan x="960" y="682.25">Project + capability host</tspan><tspan x="960" y="708.5">Own Storage / Search /</tspan><tspan x="960" y="734.75">Cosmos DB</tspan></text>
<rect x="1145" y="605" width="310" height="165" fill="#F3F5F6" stroke="#647078" stroke-width="2" />
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="middle"><tspan x="1300" y="656">B-test</tspan><tspan x="1300" y="682.25">Project + capability host</tspan><tspan x="1300" y="708.5">Own Storage / Search /</tspan><tspan x="1300" y="734.75">Cosmos DB</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="21" text-anchor="start"><tspan x="805" y="814">No inference connections or added Blob/Cosmos grants.</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="912">Dashed outlines = resource groups, not network boundaries. Private endpoints connect services to the lab VNet.</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="967">A-dev is the validated agent path. Dev/test separation is project authorization, not separate case subnets.</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="36" text-anchor="start"><tspan x="40" y="66">01 / Lab architecture</tspan></text>
<text fill="#000000" font-family="Arial, Helvetica, sans-serif" font-size="22" text-anchor="start"><tspan x="40" y="110">Resource ownership and the configured service relationships in the delivered profile.</tspan></text>
